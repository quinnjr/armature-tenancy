[package]
name = "armature-tenancy"
version = "0.4.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-tenancy"
homepage = "https://quinnjr.github.io/armature"
description = "Multi-tenancy support for Armature applications"
keywords = ["multi-tenant", "tenancy", "saas", "isolation"]
categories = ["web-programming"]

[dependencies]
armature-core = { version = "0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
regex = "1.12"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"

